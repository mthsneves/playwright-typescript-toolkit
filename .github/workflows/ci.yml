name: Playwright Tests CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium com dependências do sistema
        run: npx playwright install --with-deps chromium

      - name: Validação de tipos (Typecheck)
        run: npm run typecheck

      - name: Executar testes de automação Playwright
        run: npx playwright test

      - name: Upload de relatório Playwright como artefato
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
